[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routesentinel"
version = "0.1.0"
description = "Flag unjustified freight-cost rises per route, explained with retrieved notes."
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pydantic",
    "pandera",
    "typer",
    "pyyaml",
    "pytest",
    "hypothesis",
    "duckdb",
    "ruff",
    "mypy",
    "rank-bm25",
    "fastembed",
    "chromadb",
    "ollama",
]

[project.scripts]
sentinel = "sentinel.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
